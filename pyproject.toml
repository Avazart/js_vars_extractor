[project]
name = "js_vars_extractor"
version = "0.1.6"
description = "Extract JavaScript variables from HTML"
readme = "README.md"
authors = [
    { name = "Avazart"}
]
requires-python = ">=3.12"
dependencies = [
    "chompjs>=1.4.1",
    "esprima>=4.0.1",
    "selectolax>=0.4.11",
]

[build-system]
requires = ["uv_build>=0.8.21,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "vulture>=2.16",
]
[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    ".venv",
    ".env",
    ".idea",
    ".vscode",
]
line-length = 79
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    # pycodestyle
    #"E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    #"SIM",
    # isort
    "I",
]
ignore = []

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]


[tool.mypy]
strict = false
exclude = [
    "^venv/.*$",
    "^migrations/.*$",
    "^tests/.*$",
    "^scripts/.*$",
    "^research/.*$",
]
plugins = []

#[[tool.mypy.overrides]]
# module = "aiogram.*,apscheduler.*,gspread.*,oauth2client.*"
# ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = "test_*.py"
pythonpath = ["."]
log_cli = true
log_cli_level = "DEBUG"


[tool.pylint.messages_control]
disable = [
  "C0114",
  "C0115",
  "C0116",
  "R0903",
  "R0913",
  "R0914",
  "R0917",
]
[tool.pylint.master]
ignore = [
   ".venv",
   "migrations",
   "tests",
   "scripts",
]
